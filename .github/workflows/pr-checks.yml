name: PR-Regeln

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read
  contents: read

jobs:
  issue-referenzen:
    name: Issue-Referenzen
    runs-on: ubuntu-latest
    steps:
      - name: PR-Beschreibung und Commits prüfen
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const problems = [];

            // 1) PR-Beschreibung muss ein Schließwort mit Issue-Nummer enthalten
            const body = pr.body || "";
            const closes = /\b(close[sd]?|fix(e[sd])?|resolve[sd]?)\s+#\d+/i;
            if (!closes.test(body)) {
              problems.push("Die PR-Beschreibung braucht eine Zeile wie `Closes #12`.");
            }

            // 2) Jeder Commit (außer Merge-Commits) muss eine Issue-Nummer enthalten
            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            });
