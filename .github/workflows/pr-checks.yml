name: PR-Regeln

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read
  contents: read

jobs:
  issue-referenzen:
    name: Issue-Referenzen
    runs-on: ubuntu-latest
    steps:
      - name: PR-Beschreibung braucht "Closes #Nummer"
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if printf '%s' "$BODY" | grep -qiE '(^|[^[:alnum:]])(close[sd]?|fix(e[sd])?|resolve[sd]?)[[:space:]]+#[0-9]+'; then
            echo "OK: Closes-Referenz gefunden."
          else
            echo "::error::Die PR-Beschreibung braucht eine Zeile wie 'Closes #12'."
            exit 1
          fi

      - name: Jeder Commit braucht "#Nummer"
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          bad=$(gh api "repos/$REPO/pulls/$PR/commits" --paginate --jq '
            .[]
            | select((.parents | length) == 1)
            | select(.commit.message | test("^Merge ") | not)
            | select(.commit.message | test("#[0-9]+") | not)
            | "\(.sha[0:7])  \(.commit.message | split("\n")[0])"')
          if [ -n "$bad" ]; then
            echo "::error::Commits ohne Issue-Nummer gefunden."
            echo "$bad"
            echo "Korrigieren: git rebase -i origin/main, bei den Commits 'reword' wählen, dann git push --force-with-lease."
            exit 1
          fi
          echo "OK: alle Commits enthalten eine Issue-Nummer."
